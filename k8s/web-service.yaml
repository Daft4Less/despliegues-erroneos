apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment-blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webapp
      version: blue          # <--- Etiqueta de versión
  template:
    metadata:
      labels:
        app: webapp
        version: blue        # <--- Etiqueta de versión
    spec:
      containers:
      - name: web
        image: app:latest    # Tu imagen original
        imagePullPolicy: Never
---

apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  selector:
    app: webapp
    version: blue
  ports:
    - port: 80
      targetPort: 8080
